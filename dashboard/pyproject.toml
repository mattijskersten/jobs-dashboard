[project]
name = "jobs-dashboard"
version = "0.1.0"
description = "Mobile-friendly dashboard over data/jobs.db: review the funnel, change job state, trigger ingest/tailoring, preview tailored CVs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "starlette>=0.37",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "markdown>=3.5",
    "segno>=1.6",
]

[project.scripts]
jobs-dashboard = "jobs_dashboard.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobs_dashboard"]
