<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0e1014">
  <title>{% block title %}Jobs Dashboard{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', path='favicon.svg') }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ url_for('static', path='favicon.svg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}?v=7">
</head>
<body>
  <header class="topbar">
    <a class="home" href="{{ url_for('index') }}">
      <span class="mark" aria-hidden="true"></span>Jobs Dashboard
    </a>
    {% block headeractions %}{% endblock %}
  </header>
  <main>
    {% if request.query_params.get('msg') %}
      <div class="flash" role="alert">⚠ {{ request.query_params['msg'] }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', path='app.js') }}" defer></script>
</body>
</html>
