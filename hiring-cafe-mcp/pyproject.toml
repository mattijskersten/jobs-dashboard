[project]
name = "hiring-cafe-mcp"
version = "0.1.0"
description = "MCP server exposing hiring.cafe job search to AI agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    # scripts/ingest-jobs.py runs in this venv (via scripts/ingest.sh) and
    # reads data/search-config.yaml
    "pyyaml>=6.0",
]

[project.scripts]
hiring-cafe-mcp = "hiring_cafe_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hiring_cafe_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
